name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for real audio tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install FFmpeg for real audio tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path += ";$env:ChocolateyInstall\bin"
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          REQUIRE_REAL_AUDIO_TESTS: '1'
      - run: python -m yue2_music_director.cli --help
      - run: python -m yue2_music_director.audio_finishing --help
      - run: python -m yue2_music_director.human_feedback --help
      - name: Check Windows finishing launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: music.cmd --finish --help

      - run: python -m yue2_music_director.lock_status --help
      - name: Check Windows read-only lock launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: music.cmd --inspect-lock autonomous

      - run: python -m yue2_music_director.release_assembly --help

      - run: python -m yue2_music_director.release_delivery --help

      - run: python -m yue2_music_director.release_workflow --help
